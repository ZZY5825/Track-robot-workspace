lidar_tracklet_manager_node:
  ros__parameters:
    lidar_topic: /rslidar_points
    output_topic: /human_tracking/lidar_tracklets
    semantic_output_topic: ''
    source_epoch_seed: 0
    marker_topic: /human_tracking/lidar_tracklet_markers
    candidate_clusters_topic: /human_tracking/lidar_candidate_clusters
    candidate_marker_topic: /human_tracking/lidar_candidate_cluster_markers
    debug_topic: /human_tracking/lidar_tracklet_debug

    lidar_qos_reliability: reliable
    tracking_frame: track_robot_center
    base_frame: base_link
    map_frame: map

    min_range: 0.5
    max_range: 10.0
    min_z: -0.25
    max_z: 2.2
    remove_ground: true
    ground_z_threshold: -0.15
    voxel_leaf_size: 0.10
    max_points_before_clustering: 12000
    process_every_n_clouds: 1

    cluster_tolerance: 0.38
    min_cluster_points: 5
    cluster_core_min_points: 3
    generic_tracklet_min_points: 5
    camera_associated_min_points: 2
    max_cluster_points: 2500
    near_range_limit: 2.0
    mid_range_limit: 6.0
    near_min_cluster_points: 3
    mid_min_cluster_points: 6
    far_min_cluster_points: 2
    near_min_bbox_height: 0.10
    mid_min_bbox_height: 0.25
    far_min_bbox_height: 0.05
    impossible_candidate_width: 3.0
    impossible_candidate_depth: 3.0
    impossible_candidate_height: 2.8
    min_bbox_height: 0.15
    max_bbox_height: 2.2
    min_bbox_width: 0.05
    max_bbox_width: 1.2
    max_bbox_depth: 1.2
    show_impossible_raw_clusters: false
    max_visual_candidate_width: 3.0
    max_visual_candidate_depth: 3.0
    max_visual_candidate_height: 2.8

    tracklet_gating_distance: 1.2
    tracklet_confirm_hits: 3
    max_tracklet_missed_frames: 12
    max_tracklet_age_sec: 1.5
    max_tracklet_speed_mps: 2.2
    tracklet_process_noise_accel_std: 1.5
    tracklet_maneuver_noise_accel_std: 3.0
    tracklet_measurement_variance: 0.12
    tracklet_nis_gate: 9.21
    stationary_displacement_m: 0.10
    stationary_confirm_frames: 3
    stationary_velocity_decay: 0.5
    stationary_speed_threshold_mps: 0.08
    stationary_measurement_speed_mps: 0.25
    confidence_hit_increment: 0.15
    confidence_miss_decay: 0.06
    min_publish_confidence: 0.10

    marker_publish_rate: 15.0
    candidate_marker_publish_rate: 5.0
    debug_publish_rate: 2.0
