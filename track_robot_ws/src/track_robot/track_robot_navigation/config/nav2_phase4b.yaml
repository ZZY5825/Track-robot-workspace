bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    enable_groot_monitoring: false
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugin: goal_checker
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.70
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.40
      transform_tolerance: 0.20
      use_velocity_scaled_lookahead_dist: true
      # Bunker needs at least 0.10 m/s to overcome measured static resistance.
      min_approach_linear_velocity: 0.10
      use_approach_linear_velocity_scaling: true
      max_allowed_time_to_collision: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.50
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 12.0
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      # The tracked base must overcome static resistance immediately.  At the
      # 10 Hz controller rate, 1.5 m/s^2 permits the first commanded sample to
      # reach the supervised 0.15 m/s speed while the hard velocity cap remains
      # unchanged.
      max_linear_accel: 1.5
      max_linear_decel: 0.25
      max_angular_accel: 0.50
      rotate_to_heading_min_angle: 0.50

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

recoveries_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: [wait, spin, back_up]
    wait:
      plugin: nav2_recoveries/Wait
    spin:
      plugin: nav2_recoveries/Spin
      simulate_ahead_time: 1.5
      max_rotational_vel: 0.30
      min_rotational_vel: 0.08
      rotational_acc_lim: 0.50
    back_up:
      plugin: nav2_recoveries/BackUp
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.20

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Physical Bunker test footprint: 0.88 m long x 0.80 m wide.
      footprint: '[[-0.44,-0.40],[-0.44,0.40],[0.44,0.40],[0.44,-0.40]]'
      footprint_padding: 0.0
      transform_tolerance: 0.20
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.12
        z_voxels: 16
        max_obstacle_height: 1.80
        # A lone uncleared height voxel must not keep a one-cell pedestrian
        # trail marked after the rest of the column has been ray-cleared.
        mark_threshold: 1
        observation_sources: raw_clear filtered_mark
        raw_clear:
          topic: /rslidar_points
          data_type: PointCloud2
          min_obstacle_height: -2.0
          max_obstacle_height: 2.50
          obstacle_min_range: 0.20
          obstacle_max_range: 8.0
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          observation_persistence: 0.0
          expected_update_rate: 0.20
          clearing: true
          marking: false
        filtered_mark:
          topic: /safety/filtered_obstacle_points
          data_type: PointCloud2
          min_obstacle_height: 0.08
          max_obstacle_height: 1.80
          obstacle_min_range: 0.20
          obstacle_max_range: 8.0
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          observation_persistence: 0.0
          expected_update_rate: 0.20
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Reserve only the Bunker's physical 0.88 x 0.80 m body for Navfn.
        # The safety supervisor's separate extra margin remains disabled.
        enabled: true
        inflation_radius: 0.60
        # Decay soft obstacle costs faster while preserving the 0.60 m
        # physical collision reserve for the rectangular footprint.
        cost_scaling_factor: 12.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      # Physical Bunker test footprint: 0.88 m long x 0.80 m wide.
      footprint: '[[-0.44,-0.40],[-0.44,0.40],[0.44,0.40],[0.44,-0.40]]'
      footprint_padding: 0.0
      transform_tolerance: 0.20
      track_unknown_space: false
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: raw_clear filtered_mark
        raw_clear:
          topic: /rslidar_points
          data_type: PointCloud2
          min_obstacle_height: -2.0
          max_obstacle_height: 2.50
          obstacle_min_range: 0.20
          obstacle_max_range: 8.0
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          observation_persistence: 0.0
          expected_update_rate: 0.20
          clearing: true
          marking: false
        filtered_mark:
          topic: /safety/filtered_obstacle_points
          data_type: PointCloud2
          min_obstacle_height: 0.08
          max_obstacle_height: 1.80
          obstacle_min_range: 0.20
          obstacle_max_range: 8.0
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          observation_persistence: 0.0
          expected_update_rate: 0.20
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Reserve only the Bunker's physical 0.88 x 0.80 m body for Navfn.
        # The safety supervisor's separate extra margin remains disabled.
        enabled: true
        inflation_radius: 0.60
        # Keep this synchronized with the local costmap and controller.
        cost_scaling_factor: 12.0
      always_send_full_costmap: true
