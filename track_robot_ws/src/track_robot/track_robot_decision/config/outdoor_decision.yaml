perception_health_monitor_node:
  ros__parameters:
    image_topic: /zed/zed_node/left/image_rect_color
    lidar_topic: /rslidar_points
    imu_topic: /zed/zed_node/imu/data
    odometry_topic: /odom
    command_topic: /follow/cmd_vel_safe
    health_topic: /perception/health
    base_frame: base_link
    lidar_frame: rslidar
    camera_frame: zed_left_camera_optical_frame
    publish_rate: 10.0
    camera_timeout_sec: 0.35
    lidar_timeout_sec: 0.25
    imu_timeout_sec: 0.25
    odometry_timeout_sec: 0.30
    command_timeout_sec: 0.30
    tf_timeout_sec: 0.03
    minimum_brightness: 25.0
    maximum_brightness: 235.0
    minimum_contrast: 18.0
    minimum_blur_score: 20.0
    minimum_lidar_points: 1000
    minimum_lidar_coverage: 0.60
    maximum_near_noise_ratio: 0.20
    maximum_roll_deg: 12.0
    maximum_pitch_deg: 15.0
    stuck_command_speed: 0.05
    stuck_measured_speed: 0.02
    stuck_timeout_sec: 1.0
    unexpected_motion_speed: 0.05

follow_behavior_tree_node:
  ros__parameters:
    target_topic: /human_tracking/target_state
    health_topic: /perception/health
    avoidance_topic: /follow/avoidance_state
    safety_topic: /safety/state
    decision_topic: /follow/decision
    debug_topic: /follow/decision_debug
    marker_topic: /follow/decision_markers
    reset_target_service: /human_tracking/reset_target
    tree_xml: ""
    tick_rate: 20.0
    require_health: true
    require_avoidance_feedback: false
    require_safety_feedback: false
    target_timeout_sec: 0.50
    feedback_timeout_sec: 0.50
    confirmation_ticks: 3
    blocked_clear_ticks: 10
    confirmed_identity_confidence: 0.70
    confirmed_geometry_confidence: 0.60
    confirmed_overall_confidence: 0.65
    confirmed_max_sigma: 0.45
    confirmed_max_measurement_age: 0.20
    lidar_geometry_confidence: 0.65
    lidar_overall_confidence: 0.55
    lidar_max_sigma: 0.60
    lidar_max_age: 0.20
    lidar_only_timeout_sec: 3.0
    uncertain_hold_sec: 1.0
    search_entry_max_age_sec: 1.5
    search_timeout_sec: 4.0
    search_sector_deg: 120.0
    confirmed_max_linear: 0.30
    confirmed_max_angular: 0.45
    lidar_max_linear: 0.15
    lidar_max_angular: 0.35
    search_max_angular: 0.20
