    world_mode_enabled: false
    world_stable_samples: 3
    maximum_world_xy_variance_m2: 0.25
    maximum_world_yaw_variance_rad2: 0.12
    maximum_world_jump_m: 0.50
    maximum_world_yaw_jump_rad: 0.26

