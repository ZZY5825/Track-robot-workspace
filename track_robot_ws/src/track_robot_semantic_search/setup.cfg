[develop]
script_dir=$base/lib/track_robot_semantic_search
[install]
install_scripts=$base/lib/track_robot_semantic_search

[tool:pytest]
# The host's vendored typeguard plugin targets a newer pytest API than ROS
# Foxy's system pytest. Disable only that external plugin for deterministic
# package tests; project tests do not depend on it.
addopts = -p no:typeguard
